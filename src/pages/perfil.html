<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../src/js/tema.js"></script>
  <title>Balatro 2.0 - Perfil</title>
  <link rel="stylesheet" href="../src/css/style.css">
</head>
<body style="display: block;">
<main class="main-view-container">

  <!-- Barra Superior -->
  <header class="header-bar">
    <div class="header-left">
      <a href="../index.html" class="back-square-btn">‹</a>
      <div>
        <div class="breadcrumb-path">Menú / Perfil</div>
        <div class="top-left-status" style="position: static; font-size: 0.75rem;">
          <span class="status-dot"></span>
          Sesión iniciada
        </div>
      </div>
    </div>

    <div class="header-center-title">BALATRO 2.0</div>

    <div class="header-right">
      <a href="perfil.html" class="btn btn-outline" style="width: auto; padding: 10px 18px;">Perfil</a>
      <a href="configuracion.html" class="btn btn-outline" style="width: auto; padding: 10px 18px;">Configuración</a>
    </div>
  </header>

  <!-- Tarjeta de perfil -->
  <section class="pf-card">
    <h1 class="pf-title">Perfil</h1>
    <p class="pf-subtitle">Tu identidad en la mesa.</p>

    <div class="pf-layout">

      <!-- Columna del avatar -->
      <div class="pf-avatar-col">
        <div class="pf-avatar">
          <img id="pf-avatar-img" src="" alt="Foto de perfil">
        </div>
        <button type="button" class="pf-btn-secondary" id="pf-btn-foto">Cambiar foto</button>
        <input type="file" id="pf-file" accept="image/jpeg,image/png" hidden>
        <p class="pf-hint">JPG o PNG · Máx. 5 MB</p>
      </div>

      <!-- Columna del formulario -->
      <form class="pf-form" id="pf-form" onsubmit="event.preventDefault(); guardar();">

        <div class="pf-field">
          <label for="pf-nombre">Nombre de usuario</label>
          <div class="pf-row">
            <input type="text" id="pf-nombre" class="pf-input" value="AsDePicas" maxlength="20" readonly>
            <button type="button" class="pf-btn-outline" id="pf-editar">Editar</button>
          </div>
        </div>

        <div class="pf-field">
          <label for="pf-bio">Sobre mí</label>
          <div class="pf-textarea-wrap">
            <textarea id="pf-bio" class="pf-textarea" maxlength="200">Siempre buscando la próxima gran mano. Mi carta favorita es el as de picas.</textarea>
            <span class="pf-counter" id="pf-contador">0 / 200</span>
          </div>
        </div>

        <div class="pf-footer">
          <span class="pf-unsaved" id="pf-aviso" hidden>Cambios sin guardar</span>
          <div class="pf-actions">
            <button type="button" class="pf-btn-outline" id="pf-cancelar">Cancelar</button>
            <button type="submit" class="pf-btn-primary">Guardar cambios</button>
          </div>
        </div>

      </form>
    </div>
  </section>

  <!-- Pie de página -->
  <footer class="hub-footer">
    <a href="creditos.html" class="btn btn-outline" style="width: 100px;">Créditos</a>
    <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 500;">BALATRO 2.0</span>
    <span style="font-size: 0.75rem; color: var(--text-muted);">Cada mano cuenta.</span>
  </footer>

</main>
  <script src="../src/js/perfil.js"></script>
</body>
</html>
