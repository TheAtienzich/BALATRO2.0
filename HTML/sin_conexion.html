<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balatro 2.0 - Sin Conexión</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="top-left-status">
  <span class="status-dot offline"></span>
  Sin conexión al servidor
</div>

<div class="card-container">
  <div class="offline-icon">⚡</div>
  <span class="card-subtitle red">Error de red</span>
  <h1 class="card-title">DESCONECTADO</h1>
  <div class="divider-line"></div>

  <p class="lobby-message">
    No se ha podido establecer contacto con los servidores de Balatro 2.0. Comprueba tu conexión a Internet o inténtalo más tarde.
  </p>

  <div style="width: 100%;">
    <button class="btn btn-primary" onclick="window.location.reload()">Reintentar conexión</button>
    <a href="../index.html" class="btn btn-secondary">Volver al Menú Principal</a>
  </div>
</div>

<span class="bottom-center-caption">BALATRO 2.0 • SERVIDOR NO DISPONIBLE</span>
</body>
</html>
