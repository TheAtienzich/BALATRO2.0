<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balatro 2.0 - Iniciar Sesión</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
  <body>
    <div class="card-container">
      <span class="card-subtitle">Juego de cartas online</span>
      <h1 class="card-title">BALATRO 2.0</h1>
      <div class="divider-line"></div>

      <form action="../index.html" method="get">
        <div class="form-group">
          <label>Cuenta</label>
          <input type="text" class="form-control" placeholder="Escribe tu cuenta" required>
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" class="form-control" placeholder="••••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 1.2rem;">LOGIN</button>

        <div class="form-footer-links">
          <a href="registro.html" class="link-yellow">crear nuevo usuario</a>
          <a href="recuperar.html" class="link-muted">olvidar su contraseña</a>
        </div>
      </form>
    </div>

    <span class="bottom-center-caption">BALATRO 2.0</span>
  </body>
</html>
