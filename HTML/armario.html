<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        if (localStorage.getItem('balatro-theme') === 'light') {
          document.documentElement.classList.add('theme-light');
        }
    </script>
    <title>Balatro 2.0 - Armario</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="display: block;">
<main class="main-view-container">

    <!-- Barra Superior -->
    <header class="header-bar">
        <div class="header-left">
            <a href="../index.html" class="back-square-btn">‹</a>
            <div>
                <div class="breadcrumb-path">Menú / Armario</div>
                <div class="top-left-status" style="position: static; font-size: 0.75rem;">
                    <span class="status-dot"></span>
                    Sesión iniciada
                </div>
            </div>
        </div>

        <div class="header-center-title">BALATRO 2.0</div>

        <div class="header-right">
            <a href="perfil.html" class="btn btn-outline" style="width: auto; padding: 10px 18px;">Perfil</a>
            <a href="configuracion.html" class="btn btn-outline" style="width: auto; padding: 10px 18px;">Configuración</a>
        </div>
    </header>

    <!-- Título de la página -->
    <section class="page-header-intro">
        <h1 class="main-page-title">Armario</h1>
        <p class="page-subtitle-text">Tu colección. Tu estilo. Elige una categoría para equiparla.</p>
    </section>

    <!-- Rejilla de Categorías del Armario -->
    <section class="hub-grid" style="grid-template-columns: repeat(2, 1fr); max-width: 900px;">

        <!-- Tarjeta 1: Barajas -->
        <article class="hub-card">
            <div class="hub-card-preview">
                <div class="preview-mini-card"></div>
            </div>
            <h2 class="hub-card-name">Barajas</h2>
            <p class="hub-card-desc">2 barajas · Baraja roja equipada</p>
            <a href="armario_barajas.html" class="btn btn-secondary">Ver colección</a>
        </article>

        <!-- Tarjeta 2: Pokémon -->
        <article class="hub-card">
            <div class="hub-card-preview">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Pikachu" class="preview-pokemon-img">
            </div>
            <h2 class="hub-card-name">Pokémon</h2>
            <p class="hub-card-desc">3 Pokémon · Pikachu equipado</p>
            <a href="armario_pokemon.html" class="btn btn-secondary">Ver colección</a>
        </article>

    </section>

    <!-- Pie de página -->
    <footer class="hub-footer">
        <a href="creditos.html" class="btn btn-outline" style="width: 100px;">Créditos</a>
        <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 500;">BALATRO 2.0</span>
        <span style="font-size: 0.75rem; color: var(--text-muted);">Cada mano cuenta.</span>
    </footer>

</main>
</body>
</html>
