<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balatro 2.0 - Crear Usuario</title>
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body>
    <div class="card-container">
      <span class="card-subtitle">Nuevo usuario</span>
      <h1 class="card-title">BALATRO 2.0</h1>
      <div class="divider-line"></div>

      <form action="login.html" method="get">
        <div class="form-group">
          <label>Nombre Usuario</label>
          <input type="text" class="form-control" placeholder="Escribe tu nombre de usuario" required>
        </div>

        <div class="form-group">
          <label>Correo</label>
          <input type="email" class="form-control" placeholder="Escribe tu correo electrónico" required>
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" class="form-control" placeholder="••••••••••" required>
        </div>

        <div class="form-group">
          <label>Repetir contraseña</label>
          <input type="password" class="form-control" placeholder="••••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">CREAR USUARIO</button>

        <div style="margin-top: 1.2rem; font-size: 0.8rem;">
          <span style="color: var(--accent-yellow);">¿Ya tienes una cuenta? </span>
          <a href="login.html" class="link-yellow">Iniciar sesión</a>
        </div>
      </form>
    </div>

    <span class="bottom-center-caption">BALATRO 2.0 • JUEGA. APUESTA. SUPERA.</span>
  </body>
</html>
