<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="src/js/tema.js"></script>
  <script src="src/js/login.js" defer></script>
  <title>Balatro 2.0 - Iniciar Sesión</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
  <body>
    <div class="card-container">
      <span class="card-subtitle">Juego de cartas online</span>
      <h1 class="card-title">BALATRO 2.0</h1>
      <div class="divider-line"></div>

      <form id="login-form" action="src/pages/menu.html" method="get">
        <div class="form-group">
          <label for="login-email">Cuenta</label>
          <input type="text" id="login-email" name="email" class="form-control" placeholder="Escribe tu cuenta" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" name="password" class="form-control" placeholder="••••••••••" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 1.2rem;">LOGIN</button>

        <div class="form-footer-links">
          <a href="src/pages/registro.html" class="link-yellow">crear nuevo usuario</a>
          <a href="src/pages/recuperar.html" class="link-muted">olvidar su contraseña</a>
        </div>
      </form>
    </div>

    <span class="bottom-center-caption">BALATRO 2.0</span>
  </body>
</html>
