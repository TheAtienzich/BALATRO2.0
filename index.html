<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="src/tema.js"></script>
    <title>Balatro 2.0 - Menú Principal</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body style="padding-bottom: 50px;">
    <div class="green-accent-line"></div>

    <div class="top-left-status">
      <span class="status-dot"></span>
      Sesión iniciada
    </div>

    <div class="top-right-nav">
      <a href="HTML/perfil.html" class="btn btn-outline">Perfil</a>
      <a href="HTML/configuracion.html" class="btn btn-outline">Configuración</a>
      <a href="#" class="btn btn-outline">Información</a>
    </div>

    <div class="card-container">
      <span class="card-subtitle">Juego de cartas en línea</span>
      <h1 class="card-title">BALATRO 2.0</h1>
      <div class="divider-line"></div>

      <div class="cards-visual">
        <div class="card-item card-back"></div>
        <div class="card-item card-ace">
          <span class="top-left">A♠</span>
          <span class="spade-center">♠</span>
          <span class="bottom-right">A♠</span>
        </div>
        <div class="card-item card-king">
          <span class="top-left">K♥</span>
          <span class="king-center">♚</span>
          <span class="bottom-right">K♥</span>
        </div>
      </div>

      <p class="lobby-message">La mesa está lista. Tu próxima mano te espera.</p>

      <div style="width: 100%;">
        <a href="#" class="btn btn-primary">Jugar</a>
        <a href="HTML/tienda.html" class="btn btn-secondary">Tienda</a>
        <a href="HTML/armario.html" class="btn btn-secondary">Armario</a>
      </div>
    </div>

   
    <footer class="hub-footer index-footer">
      <a href="HTML/creditos.html" class="btn btn-outline" style="width: 100px;">Créditos</a>
      <span class="index-footer-brand">BALATRO 2.0</span>
      <span class="index-footer-slogan">Cada mano cuenta.</span>
    </footer>
  </body>
</html>
